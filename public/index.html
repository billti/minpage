<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="build/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>minpage</title>
  </head>
  <body class="minpage-body">
    <div class="minpage-app" id="app">
      <div class="minpage-toolstrip">
        <svg
          class="minpage-toolbar"
          viewBox="0 0 1120 256"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g fill="none">
            <g class="minpage-icon" transform="translate(0)">
              <circle cx="128" cy="128" r="116" data-control="prev" />
              <path d="M60,128 l55,-32 l0,64 z" />
              <path d="M122,128 l55,-32 l0,64 z" />
            </g>
            <g class="minpage-icon" transform="translate(288)">
              <circle cx="128" cy="128" r="116" data-control="pause" />
              <path d="M99 80 l16 0 l0 96 l-16 0 z" />
              <path d="M141 80 l16 0 l0 96 l-16 0 z" />
            </g>
            <g class="minpage-icon" transform="translate(576)">
              <circle cx="128" cy="128" r="116" data-control="play" />
              <path d="M180,128 l-83,-47 l0,96 z" />
            </g>
            <g class="minpage-icon" transform="translate(864)">
              <circle cx="128" cy="128" r="116" data-control="next" />
              <path d="M196,128 l-55,-32 l0,64 z" />
              <path d="M134,128 l-55,-32 l0,64 z" />
            </g>
          </g>
        </svg>
        <div class="minpage-step">1280 / 9376</div>
        <input
          type="range"
          class="minpage-slider"
          id="slider"
          min="0"
          max="9376"
          value="1280"
        />
        <div class="minpage-bigsmall">
          <svg class="minpage-toolbar" viewBox="0 0 544 256">
            <g class="minpage-icon">
              <circle cx="128" cy="128" r="116" data-control="zoom-in" />
              <path class="minpage-icon-line" d="M68 144 l60 -50 l60 50" />
            </g>
            <g class="minpage-icon" transform="translate(288)">
              <circle cx="128" cy="128" r="116" data-control="zoom-out" />
              <path class="minpage-icon-line" d="M68 112 l60 50 l60 -50" />
            </g>
          </svg>
        </div>
      </div>
      <div class="minpage-zones"></div>
    </div>
    <script src="build/index.js"></script>
  </body>
</html>
